services:
  document-copilot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document_copilot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist Chroma vector store, doc store, and uploads outside the container
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
